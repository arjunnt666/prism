name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: cli smoke
        run: |
          cargo build -p prism-cli
          ./target/debug/prism version
          ./target/debug/prism capture --query "ci smoke" --provider sample --out /tmp/prism-ci.json
          ./target/debug/prism features --snapshot /tmp/prism-ci.json
          ./target/debug/prism diff --before data/samples/before.json --after data/samples/after.json
          ./target/debug/prism history --store-dir data/samples
          ./target/debug/prism report --store-dir data/samples
          ./target/debug/prism competitors --store-dir data/samples

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: syntax
        run: python -m py_compile packages/prism-py/src/prism/__init__.py
