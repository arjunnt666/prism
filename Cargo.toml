[workspace]
resolver = "2"
members = [
    "crates/prism-core",
    "crates/prism-collect",
    "crates/prism-parse",
    "crates/prism-features",
    "crates/prism-store",
    "crates/prism-diff",
    "crates/prism-analyze",
    "crates/prism-cli",
]
default-members = ["crates/prism-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arjunnt666/prism"
authors = ["Arjun NT"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
regex = "1"
once_cell = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
